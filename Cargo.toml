[package]
name = "keelrs"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for keel, a durable execution engine."
license = "Apache-2.0"
repository = "https://github.com/mvaleed/keelrs"
keywords = ["workflow", "durable-execution", "saga"]
categories = ["api-bindings"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
log = "0.4.34"
env_logger = "0.11"
